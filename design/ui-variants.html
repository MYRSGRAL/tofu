<body>
<main class="comparison">
  <nav class="variants" aria-label="Варианты интерфейса">
    <button type="button" class="variant-tab" data-variant="a" aria-pressed="true"><span class="tab-top"><span class="tab-letter">А</span><span class="tab-state">Открыт</span></span><span class="tab-title">Один фокус</span><span class="tab-caption">Крупно и спокойно</span><span class="mini mini-a" aria-hidden="true"><span class="mini-card"></span><span class="mini-power"></span></span></button>
    <button type="button" class="variant-tab" data-variant="b" aria-pressed="false"><span class="tab-top"><span class="tab-letter">Б</span><span class="tab-state">Смотреть</span></span><span class="tab-title">Рядом</span><span class="tab-caption">Больше места по горизонтали</span><span class="mini" aria-hidden="true"><span class="mini-card"></span><span class="mini-power"></span></span></button>
    <button type="button" class="variant-tab" data-variant="c" aria-pressed="false"><span class="tab-top"><span class="tab-letter">В</span><span class="tab-state">Смотреть</span></span><span class="tab-title">Под рукой</span><span class="tab-caption">Компактное подключение</span><span class="mini mini-c" aria-hidden="true"><span class="mini-card"></span><span class="mini-power"></span></span></button>
  </nav>
  <section id="app" class="app variant-a" aria-label="Интерактивный макет yonik"></section>
  <div class="choice-bar"><p id="choice-copy" class="choice-copy" aria-live="polite">Какой вариант взять за основу?</p><button id="choose" class="choose" type="button">Выбрать А</button></div>
  <p class="prototype-note">Это варианты будущего интерфейса. Серверы и состояния демонстрационные: макет не подключается к сети, не меняет proxy, DNS или firewall. Выбор варианта и настройки хранятся только до закрытия страницы.</p>
</main>
<script>
'use strict';
const icons = {
 gear:'<circle cx="12" cy="12" r="3"/><path d="m9.2 3-.6 2.2-1.7 1-2.2-.6L2.9 8.7l1.6 1.6v2L3 14l1.8 3.1 2.2-.6 1.7 1 .6 2.2h3.6l.6-2.2 1.7-1 2.2.6 1.8-3.1-1.5-1.7v-2l1.5-1.6-1.8-3.1-2.2.6-1.7-1-.6-2.2Z"/>',
 power:'<path d="M12 3v9M6.1 5.7a9 9 0 1 0 11.8 0"/>',
 arrow:'<path d="m9 5 7 7-7 7"/>',
 back:'<path d="m14 5-7 7 7 7M7 12h13"/>',
 star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9Z"/>'
};
const svg = (name, className='') => `<svg class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]}</svg>`;
const servers = [
 {id:'de',name:'Германия',city:'Франкфурт',code:'DE',flag:'<path fill="#151515" d="M0 0h36v8H0z"/><path fill="#c34d5a" d="M0 8h36v8H0z"/><path fill="#dcc16e" d="M0 16h36v8H0z"/>'},
 {id:'nl',name:'Нидерланды',city:'Амстердам',code:'NL',flag:'<path fill="#b64b5b" d="M0 0h36v8H0z"/><path fill="#ede8e5" d="M0 8h36v8H0z"/><path fill="#4e6698" d="M0 16h36v8H0z"/>'},
 {id:'se',name:'Швеция',city:'Стокгольм',code:'SE',flag:'<path fill="#496d98" d="M0 0h36v24H0z"/><path fill="#dcc16e" d="M10 0h5v24h-5z"/><path fill="#dcc16e" d="M0 9h36v5H0z"/>'}
];
const flag = s => `<svg class="flag" viewBox="0 0 36 24" aria-hidden="true">${s.flag}</svg>`;
const state = {variant:'a',screen:'home',server:'de',connected:false,choice:null,settings:{engine:'sing-box',port:'1080',health:'https://example.com/',kill:false}};
const letters = {a:'А',b:'Б',c:'В'};
const app = document.querySelector('#app');
function serverButton(server, extra='') {
 return `<button type="button" class="server-card" data-action="${extra || 'picker'}" ${extra ? `data-id="${server.id}"` : ''} aria-label="${extra ? 'Выбрать: ' : 'Сменить сервер: '}${server.name}, ${server.city}">${flag(server)}<span class="server-copy"><strong>${server.name}</strong><small>${server.city}</small></span>${svg('arrow','chevron')}</button>`;
}
function renderHome() {
 const server = servers.find(s => s.id === state.server);
 const quick = '';
 return `<div class="home"><div class="server-area">${state.variant==='b'?'<p class="server-heading">Выбранный сервер</p>':''}${serverButton(server)}${state.variant==='b'?'<p class="server-hint">Сменить локацию можно в любой момент.</p>':''}</div><div class="power-block"><button type="button" class="power ${state.connected?'connected':''}" data-action="connect" aria-pressed="${state.connected}" aria-label="${state.connected?'Отключить демо-подключение':'Включить демо-подключение'}">${svg('power')}</button><p class="connection-title" role="status">${state.connected?'Демо-подключение':'Не подключено'}</p><p class="connection-note">${state.connected?'Нажмите, чтобы отключить макет':'Нажмите, чтобы подключиться'}</p>${quick}</div></div><p class="app-foot"><span class="status-dot"></span>${state.connected?'Демонстрация состояния · сеть не меняется':'Ваше подключение начинается здесь'}</p>`;
}
function renderPicker() {
 return `<section class="screen"><div class="back-heading"><button type="button" class="icon-button" data-action="home" aria-label="Назад к подключению">${svg('back')}</button><h2 class="screen-title">Выбор сервера</h2></div><p class="screen-note">Демонстрационные локации · задержка не измерялась</p><label class="sr-only" for="search">Поиск страны или города</label><input id="search" class="search" type="search" placeholder="Страна или город" autocomplete="off"><div id="server-list" class="server-list"></div></section>`;
}
function renderList(query='') {
 const list = servers.filter(s=>`${s.name} ${s.city} ${s.code}`.toLocaleLowerCase('ru').includes(query.trim().toLocaleLowerCase('ru')));
 document.querySelector('#server-list').innerHTML = list.map(s=>`<div class="server-row ${state.server===s.id?'selected':''}">${serverButton(s,'select')}</div>`).join('') || '<p class="empty">Серверы не найдены</p>';
}
function renderSettings() {
 return `<section class="screen"><div class="back-heading"><button type="button" class="icon-button" data-action="home" aria-label="Назад к подключению">${svg('back')}</button><h2 class="screen-title">Настройки</h2></div><p class="screen-note">Планируемая структура. Значения меняются только внутри макета.</p><div class="settings-grid"><section class="settings-group"><h3>Подключение</h3><label class="field">Ядро<select data-setting="engine"><option value="sing-box">sing-box</option><option value="xray">Xray</option></select></label><label class="field">Локальный SOCKS-порт<input data-setting="port" type="number" min="1024" max="65535" value="1080"></label></section><section class="settings-group"><h3>Сеть и маршрутизация</h3><label class="field">Режим<select disabled><option>Локальный proxy · концепт</option></select></label><p class="connection-note" style="text-align:left">TUN, DNS и Fake-IP <span class="planned">Запланировано</span></p></section><section class="settings-group"><h3>Защита</h3><label class="setting-line"><input data-setting="kill" type="checkbox"><span>Kill switch<small>Намерение включить в макете. Защита firewall не применена.</small></span></label><p class="connection-note" style="text-align:left">Applied-статус: не проверялся</p></section><section class="settings-group"><h3>Диагностика</h3><label class="field">URL HTTPS-проверки<input data-setting="health" type="url" value="https://example.com/" autocomplete="off"></label><p class="connection-note" style="text-align:left">Проверка не запускалась. Сетевых запросов нет.</p></section><section class="settings-group"><h3>Подписки</h3><p class="connection-note" style="text-align:left;margin-bottom:12px">Источники и обновления — в этом разделе.</p><button type="button" class="settings-action" data-action="update">Обновить · демо</button><p id="settings-feedback" class="settings-feedback" role="status"></p></section><section class="settings-group"><h3>Этот макет</h3><p class="connection-note" style="text-align:left">Здесь можно проверить расположение параметров. Настройки не сохраняются на диск и не управляют приложением.</p></section></div></section>`;
}
function render() {
 app.className = `app variant-${state.variant}`;
 app.innerHTML = `<header class="app-header"><span class="wordmark"><span class="yonik-mark" aria-hidden="true"></span>yonik</span>${state.screen==='home'?`<button type="button" class="icon-button" data-action="settings" aria-label="Открыть настройки">${svg('gear')}</button>`:'<span class="view-name">yonik / макет</span>'}</header>${state.screen==='home'?renderHome():state.screen==='picker'?renderPicker():renderSettings()}`;
 if(state.screen==='picker') renderList();
 if(state.screen==='settings') app.querySelectorAll('[data-setting]').forEach(field=>{const value=state.settings[field.dataset.setting];if(field.type==='checkbox')field.checked=value;else field.value=value;});
 document.querySelectorAll('[data-variant]').forEach(button=>{const active=button.dataset.variant===state.variant;button.setAttribute('aria-pressed',String(active));button.querySelector('.tab-state').textContent=active?'Открыт':'Смотреть';});
 document.querySelector('#choose').textContent=`Выбрать ${letters[state.variant]}`;
}
function focusScreen() { app.querySelector('.screen-title')?.setAttribute('tabindex','-1'); app.querySelector('.screen-title')?.focus(); }
document.querySelector('.variants').addEventListener('click',event=>{const button=event.target.closest('[data-variant]');if(!button)return;state.variant=button.dataset.variant;state.screen='home';render();});
app.addEventListener('click',event=>{
 const button=event.target.closest('[data-action]');if(!button)return;
 const {action,id}=button.dataset;
 if(action==='connect'){state.connected=!state.connected;render();app.querySelector('[data-action=connect]').focus();}
 if(action==='settings'||action==='picker'){state.screen=action;render();focusScreen();}
 if(action==='home'){state.screen='home';render();app.querySelector('[data-action=settings]').focus();}
 if(action==='select'||action==='quick'){state.server=id;state.screen='home';render();app.querySelector(action==='select'?'[data-action=picker]':`[data-action=quick][data-id=${id}]`).focus();}
 if(action==='update')document.querySelector('#settings-feedback').textContent='Демо: запрос не отправлен, источники не изменены.';
});
app.addEventListener('input',event=>{if(event.target.id==='search')renderList(event.target.value);});
app.addEventListener('change',event=>{const field=event.target;if(!field.dataset.setting)return;if(!field.checkValidity()){field.reportValidity();field.value=state.settings[field.dataset.setting];return;}state.settings[field.dataset.setting]=field.type==='checkbox'?field.checked:field.value;});
app.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.screen!=='home'){state.screen='home';render();app.querySelector('[data-action=picker]').focus();}});
document.querySelector('#choose').addEventListener('click',()=>{state.choice=state.variant;document.querySelector('#choice-copy').textContent=`Отмечен вариант ${letters[state.choice]} «${{a:'Один фокус',b:'Рядом',c:'Под рукой'}[state.choice]}». Выбор остаётся в макете.`;});
render();
</script>
