<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="cloud.highpriority.yonik.Network1"/>
  </policy>
  <policy context="default">
    <deny own="cloud.highpriority.yonik.Network1"/>
    <!-- Каждая операция отдельно проверяет polkit по уникальному sender. -->
    <allow send_destination="cloud.highpriority.yonik.Network1"/>
  </policy>
</busconfig>
