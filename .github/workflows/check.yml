name: Проверки

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Разместить сборку вне checkout
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/tofu-target" >> "$GITHUB_ENV"
      - name: Установить SQLite и частный D-Bus для тестов
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsqlite3-dev pkg-config dbus-daemon
      - name: Установить Rust и проверки
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - name: Проверить форматирование
        run: |
          cargo +1.85.1 fmt --all -- --check
          rustfmt +1.85.1 --check tests/engines/host_fixture.rs
      - name: Проверить clippy
        run: cargo +1.85.1 clippy --workspace --all-targets --locked -- -D warnings
      - name: Выполнить тесты
        run: cargo +1.85.1 test --workspace --locked
      - name: Проверить пакет из 10000 TCP-серий на loopback
        run: cargo +1.85.1 test -p tofu-linux --lib --locked -- --ignored --exact tcp_batch::tests::ten_thousand_loopback_series
      - name: Собрать release
        run: cargo +1.85.1 build --workspace --release --locked
      - name: Проверить общую библиотеку для Android
        run: |
          rustup target add aarch64-linux-android --toolchain 1.85.1
          cargo +1.85.1 check --workspace --target aarch64-linux-android --locked
  ui_benchmark_model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Подготовить изолированный UI benchmark
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/tofu-ui-benchmark-target" >> "$GITHUB_ENV"
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - name: Проверить форматирование оболочек и общий actor
        run: |
          cargo +1.97.0 fmt --manifest-path bench/ui/Cargo.toml --all -- --check
          cargo +1.97.0 clippy --manifest-path bench/ui/Cargo.toml -p ui-bench-model --all-targets --locked -- -D warnings
          cargo +1.97.0 test --manifest-path bench/ui/Cargo.toml -p ui-bench-model --locked
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Проверить диагностические инструменты
        run: |
          python3 -m venv "$RUNNER_TEMP/tofu-lint"
          "$RUNNER_TEMP/tofu-lint/bin/pip" install ruff==0.17.4
          "$RUNNER_TEMP/tofu-lint/bin/ruff" format --check tools
          "$RUNNER_TEMP/tofu-lint/bin/ruff" check tools
          python3 -m unittest discover -s tools/tests -v
  native_adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Собрать закреплённый native adapter и проверить DNS
        shell: bash
        run: |
          set -euo pipefail
          tofu_native_root="$RUNNER_TEMP/tofu-native-adapter"
          python3 tools/build_native_adapter.py --build-root "$tofu_native_root" --output-dir "$RUNNER_TEMP/tofu-native-artifact"
          export GOTOOLCHAIN=local GOENV=off GOWORK=off
          export GOCACHE="$tofu_native_root/build-native-adapter-cache/go-build"
          export GOMODCACHE="$tofu_native_root/build-native-adapter-cache/go-mod"
          export GOTMPDIR="$tofu_native_root/build-native-adapter-cache/go-tmp"
          export TMPDIR="$tofu_native_root/build-native-adapter-cache/tmp"
          flock -s "$tofu_native_root" go -C "$tofu_native_root/build-source-sing-box" test -mod=readonly ./adapter ./common/dialer ./dns ./route ./route/rule ./protocol/direct ./option
          flock -s "$tofu_native_root" go -C "$tofu_native_root/build-source-sing-box" test -mod=readonly -race ./adapter ./common/dialer ./dns ./route ./route/rule ./protocol/direct ./option -count=1
          flock -s "$tofu_native_root" git -C "$tofu_native_root/build-source-sing-box" diff --exit-code -- go.mod go.sum
  desktop:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QT_QUICK_CONTROLS_STYLE: Basic
      QT_FORCE_STDERR_LOGGING: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Установить Qt и системный SQLite
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential lld pkg-config qt6-base-dev qt6-declarative-dev libsqlite3-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript qml6-module-qtqml-models
      - name: Подготовить окружение Qt
        run: |
          mkdir -m 700 "$RUNNER_TEMP/tofu-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/tofu-runtime" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/tofu-target" >> "$GITHUB_ENV"
          rustup toolchain install 1.85.1 --profile minimal --component clippy
      - name: Проверить и собрать настоящий GUI
        run: |
          cargo +1.85.1 clippy -p tofu-desktop --features gui --all-targets --locked -- -D warnings
          cargo +1.85.1 build -p tofu-desktop --features gui --locked
      - name: Проверить GUI без внешней сети и ядер
        run: |
          python3 tools/desktop_smoke.py "$CARGO_TARGET_DIR/debug/tofu-desktop" --case profiles --no-namespace --output "$RUNNER_TEMP/gui-profiles"
          python3 tools/desktop_smoke.py "$CARGO_TARGET_DIR/debug/tofu-desktop" --case partial --no-namespace --output "$RUNNER_TEMP/gui-partial"
          python3 tools/desktop_smoke.py "$CARGO_TARGET_DIR/debug/tofu-desktop" --case tcp-basic --no-namespace --output "$RUNNER_TEMP/gui-tcp"
      - name: Проверить действия пользователя в тёмном UI А
        run: |
          python3 tools/desktop_ui_smoke.py "$CARGO_TARGET_DIR/debug/tofu-desktop" --output "$RUNNER_TEMP/gui-ui-a"
          python3 tools/desktop_ui_smoke.py "$CARGO_TARGET_DIR/debug/tofu-desktop" --output "$RUNNER_TEMP/gui-ui-a-compact" --width 520 --height 640 --scale 1.5
