name: Проверки

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Разместить сборку вне checkout
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/tofu-target" >> "$GITHUB_ENV"
      - name: Установить заголовки системного SQLite
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsqlite3-dev pkg-config
      - name: Установить Rust и проверки
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - name: Проверить форматирование
        run: |
          cargo +1.85.1 fmt --all -- --check
          rustfmt +1.85.1 --check tests/engines/host_fixture.rs
      - name: Проверить clippy
        run: cargo +1.85.1 clippy --workspace --all-targets --locked -- -D warnings
      - name: Выполнить тесты
        run: cargo +1.85.1 test --workspace --locked
      - name: Собрать release
        run: cargo +1.85.1 build --workspace --release --locked
      - name: Проверить общую библиотеку для Android
        run: |
          rustup target add aarch64-linux-android --toolchain 1.85.1
          cargo +1.85.1 check --workspace --target aarch64-linux-android --locked
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Проверить диагностические инструменты
        run: |
          python3 -m venv "$RUNNER_TEMP/tofu-lint"
          "$RUNNER_TEMP/tofu-lint/bin/pip" install ruff==0.17.4
          "$RUNNER_TEMP/tofu-lint/bin/ruff" format --check tools
          "$RUNNER_TEMP/tofu-lint/bin/ruff" check tools
          python3 -m unittest discover -s tools/tests -v
  desktop:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QT_QUICK_CONTROLS_STYLE: Basic
      QT_FORCE_STDERR_LOGGING: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Установить Qt и системный SQLite
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config qt6-base-dev qt6-declarative-dev libsqlite3-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript qml6-module-qtqml-models
      - name: Подготовить окружение Qt
        run: |
          mkdir -m 700 "$RUNNER_TEMP/tofu-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/tofu-runtime" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/tofu-target" >> "$GITHUB_ENV"
          rustup toolchain install 1.85.1 --profile minimal --component clippy
      - name: Проверить и собрать настоящий GUI
        run: |
          cargo +1.85.1 clippy -p tofu-desktop --features gui --all-targets --locked -- -D warnings
          cargo +1.85.1 build -p tofu-desktop --features gui --locked
      - name: Проверить GUI без внешней сети и ядер
        run: |
          python3 tools/desktop_smoke.py "$CARGO_TARGET_DIR/debug/tofu-desktop" --case profiles --no-namespace --output "$RUNNER_TEMP/gui-profiles"
          python3 tools/desktop_smoke.py "$CARGO_TARGET_DIR/debug/tofu-desktop" --case partial --no-namespace --output "$RUNNER_TEMP/gui-partial"
