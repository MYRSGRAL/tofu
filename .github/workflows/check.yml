name: Проверки

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/tofu-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Установить Rust и проверки
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - name: Проверить форматирование
        run: cargo +1.85.1 fmt --all -- --check
      - name: Проверить clippy
        run: cargo +1.85.1 clippy --workspace --all-targets --locked -- -D warnings
      - name: Выполнить тесты
        run: cargo +1.85.1 test --workspace --locked
      - name: Собрать release
        run: cargo +1.85.1 build --workspace --release --locked
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Проверить диагностические инструменты
        run: |
          python3 -m venv "$RUNNER_TEMP/tofu-lint"
          "$RUNNER_TEMP/tofu-lint/bin/pip" install ruff==0.17.4
          "$RUNNER_TEMP/tofu-lint/bin/ruff" format --check tools
          "$RUNNER_TEMP/tofu-lint/bin/ruff" check tools
