name: Проверки

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Разместить сборку вне checkout
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/yonik-target" >> "$GITHUB_ENV"
      - name: Установить SQLite, D-Bus и сетевые тестовые инструменты
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsqlite3-dev pkg-config dbus-daemon iproute2 nftables
      - name: Подготовить Arch-пути только для namespace fixtures Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          for yonik_tool in ip nft; do
            if [[ ! -e "/usr/bin/$yonik_tool" || -L "/usr/bin/$yonik_tool" ]]; then
              test -x "/usr/sbin/$yonik_tool"
              sudo install --owner=root --group=root --mode=0755 "/usr/sbin/$yonik_tool" "/usr/bin/$yonik_tool"
              test ! -L "/usr/bin/$yonik_tool"
            fi
          done
      - name: Установить Rust и проверки
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - name: Проверить форматирование
        run: |
          cargo +1.85.1 fmt --all -- --check
          rustfmt +1.85.1 --check tests/engines/host_fixture.rs
      - name: Проверить clippy
        run: cargo +1.85.1 clippy --workspace --all-targets --locked -- -D warnings
      - name: Выполнить тесты
        run: cargo +1.85.1 test --workspace --locked
      - name: Проверить настоящие TUN, firewall и recovery в отдельных namespaces
        shell: bash
        run: |
          set -euo pipefail
          yonik_ci_stage="$(mktemp -d /var/tmp/yonik-network-ci-XXXXXX)"
          chmod 0755 "$yonik_ci_stage"
          yonik_cleanup_stage() {
            sudo /usr/bin/python3 -c 'import pathlib,shutil,sys; p=pathlib.Path(sys.argv[1]); assert p.parent==pathlib.Path("/var/tmp") and p.name.startswith(("yonik-network-ci-","yonik-native-ci-")) and not p.is_symlink(); shutil.rmtree(p)' "$yonik_ci_stage"
          }
          trap yonik_cleanup_stage EXIT
          git archive --format=tar HEAD | tar --extract --directory "$yonik_ci_stage"
          chmod -R a+rX "$yonik_ci_stage"
          (
            cd "$yonik_ci_stage"
            CARGO_TARGET_DIR="$yonik_ci_stage/target" cargo +1.85.1 test -p yonik-linux --lib --no-run --locked --message-format=json > "$RUNNER_TEMP/yonik-network-tests.jsonl"
          )
          yonik_network_test="$(python3 -c 'import json,sys; rows=[json.loads(line) for line in open(sys.argv[1])]; paths=[r["executable"] for r in rows if r.get("reason")=="compiler-artifact" and r.get("target",{}).get("name")=="yonik_linux" and r.get("profile",{}).get("test") and r.get("executable")]; assert len(paths)==1, paths; print(paths[0])' "$RUNNER_TEMP/yonik-network-tests.jsonl")"
          install --mode=0755 "$yonik_network_test" "$yonik_ci_stage/yonik-linux-tests"
          for yonik_case in owned-tun tun-config public-block durable-policy service; do
            sudo /usr/bin/python3 "$yonik_ci_stage/tools/managed_network_smoke.py" "$yonik_ci_stage/yonik-linux-tests" --case "$yonik_case"
          done
      - name: Проверить пакет из 10000 TCP-серий на loopback
        run: cargo +1.85.1 test -p yonik-linux --lib --locked -- --ignored --exact tcp_batch::tests::ten_thousand_loopback_series
      - name: Собрать release
        run: cargo +1.85.1 build --workspace --release --locked
      - name: Проверить общую библиотеку для Android
        run: |
          rustup target add aarch64-linux-android --toolchain 1.85.1
          cargo +1.85.1 check --workspace --target aarch64-linux-android --locked
  ui_benchmark_model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Подготовить изолированный UI benchmark
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/yonik-ui-benchmark-target" >> "$GITHUB_ENV"
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - name: Проверить форматирование оболочек и общий actor
        run: |
          cargo +1.97.0 fmt --manifest-path bench/ui/Cargo.toml --all -- --check
          cargo +1.97.0 clippy --manifest-path bench/ui/Cargo.toml -p ui-bench-model --all-targets --locked -- -D warnings
          cargo +1.97.0 test --manifest-path bench/ui/Cargo.toml -p ui-bench-model --locked
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Проверить диагностические инструменты
        run: |
          python3 -m venv "$RUNNER_TEMP/yonik-lint"
          "$RUNNER_TEMP/yonik-lint/bin/pip" install ruff==0.17.4
          "$RUNNER_TEMP/yonik-lint/bin/ruff" format --check tools
          "$RUNNER_TEMP/yonik-lint/bin/ruff" check tools
          python3 -m unittest discover -s tools/tests -v
  native_adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Собрать закреплённый native adapter и проверить DNS
        shell: bash
        run: |
          set -euo pipefail
          yonik_native_root="$RUNNER_TEMP/yonik-native-adapter"
          python3 tools/build_native_adapter.py --build-root "$yonik_native_root" --output-dir "$RUNNER_TEMP/yonik-native-artifact"
          export GOTOOLCHAIN=local GOENV=off GOWORK=off
          export GOCACHE="$yonik_native_root/build-native-adapter-cache/go-build"
          export GOMODCACHE="$yonik_native_root/build-native-adapter-cache/go-mod"
          export GOTMPDIR="$yonik_native_root/build-native-adapter-cache/go-tmp"
          export TMPDIR="$yonik_native_root/build-native-adapter-cache/tmp"
          flock -s "$yonik_native_root" go -C "$yonik_native_root/build-source-sing-box" test -mod=readonly ./adapter ./common/dialer ./dns ./route ./route/rule ./protocol/direct ./protocol/tun ./option
          flock -s "$yonik_native_root" go -C "$yonik_native_root/build-source-sing-box" test -mod=readonly -race ./adapter ./common/dialer ./dns ./route ./route/rule ./protocol/direct ./protocol/tun ./option -count=1
          flock -s "$yonik_native_root" git -C "$yonik_native_root/build-source-sing-box" diff --exit-code -- go.mod go.sum
      - name: Проверить persistent и скомпилированный TUN адаптированного sing-box
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends iproute2 libsqlite3-dev pkg-config dbus-daemon
          rustup toolchain install 1.85.1 --profile minimal
          if [ ! -e /usr/bin/ip ] || [ -L /usr/bin/ip ]; then
            test -x /usr/sbin/ip
            sudo install --owner=root --group=root --mode=0755 /usr/sbin/ip /usr/bin/ip
            test ! -L /usr/bin/ip
          fi
          yonik_ci_stage="$(mktemp -d /var/tmp/yonik-native-ci-XXXXXX)"
          chmod 0755 "$yonik_ci_stage"
          yonik_cleanup_stage() {
            sudo /usr/bin/python3 -c 'import pathlib,shutil,sys; p=pathlib.Path(sys.argv[1]); assert p.parent==pathlib.Path("/var/tmp") and p.name.startswith(("yonik-network-ci-","yonik-native-ci-")) and not p.is_symlink(); shutil.rmtree(p)' "$yonik_ci_stage"
          }
          trap yonik_cleanup_stage EXIT
          git archive --format=tar HEAD | tar --extract --directory "$yonik_ci_stage"
          chmod -R a+rX "$yonik_ci_stage"
          install --mode=0755 "$RUNNER_TEMP/yonik-native-artifact/sing-box" "$yonik_ci_stage/sing-box"
          sudo flock -s "$RUNNER_TEMP/yonik-native-adapter" /usr/bin/python3 "$yonik_ci_stage/tools/owned_tun_smoke.py" sing-box "$yonik_ci_stage/sing-box"
          (
            cd "$yonik_ci_stage"
            CARGO_TARGET_DIR="$yonik_ci_stage/target" CARGO_BUILD_JOBS=2 cargo +1.85.1 test -p yonik-linux --lib --no-run --locked --message-format=json > "$RUNNER_TEMP/yonik-compiled-tun-tests.jsonl"
          )
          yonik_network_test="$(python3 -c 'import json,sys; rows=[json.loads(line) for line in open(sys.argv[1])]; paths=[r["executable"] for r in rows if r.get("reason")=="compiler-artifact" and r.get("target",{}).get("name")=="yonik_linux" and r.get("profile",{}).get("test") and r.get("executable")]; assert len(paths)==1, paths; print(paths[0])' "$RUNNER_TEMP/yonik-compiled-tun-tests.jsonl")"
          install --mode=0755 "$yonik_network_test" "$yonik_ci_stage/yonik-linux-tests"
          sudo flock -s "$RUNNER_TEMP/yonik-native-adapter" /usr/bin/python3 "$yonik_ci_stage/tools/managed_network_smoke.py" "$yonik_ci_stage/yonik-linux-tests" --case compiled-tun --engine sing-box --engine-binary "$yonik_ci_stage/sing-box"
  desktop:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QT_QUICK_CONTROLS_STYLE: Basic
      QT_FORCE_STDERR_LOGGING: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Установить Qt и системный SQLite
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential lld pkg-config qt6-base-dev qt6-declarative-dev libsqlite3-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript qml6-module-qtqml-models
      - name: Подготовить окружение Qt
        id: qt_environment
        run: |
          # Полный путь UNIX-сокета с SHA-256 должен быть короче 107 байт.
          yonik_runtime="$(mktemp -d /tmp/yonik-qt-XXXXXX)"
          printf 'runtime=%s\n' "$yonik_runtime" >> "$GITHUB_OUTPUT"
          printf 'XDG_RUNTIME_DIR=%s\n' "$yonik_runtime" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/yonik-target" >> "$GITHUB_ENV"
          rustup toolchain install 1.85.1 --profile minimal --component clippy
      - name: Проверить и собрать настоящий GUI
        run: |
          cargo +1.85.1 clippy -p yonik-desktop --features gui --all-targets --locked -- -D warnings
          cargo +1.85.1 build -p yonik-desktop --features gui --locked
      - name: Проверить GUI без внешней сети и ядер
        run: |
          python3 tools/desktop_smoke.py "$CARGO_TARGET_DIR/debug/yonik-desktop" --case profiles --no-namespace --output "$RUNNER_TEMP/gui-profiles"
          python3 tools/desktop_smoke.py "$CARGO_TARGET_DIR/debug/yonik-desktop" --case partial --no-namespace --output "$RUNNER_TEMP/gui-partial"
          python3 tools/desktop_smoke.py "$CARGO_TARGET_DIR/debug/yonik-desktop" --case tcp-basic --no-namespace --output "$RUNNER_TEMP/gui-tcp"
      - name: Проверить действия пользователя в тёмном UI А
        run: |
          python3 tools/desktop_ui_smoke.py "$CARGO_TARGET_DIR/debug/yonik-desktop" --output "$RUNNER_TEMP/gui-ui-a"
          python3 tools/desktop_ui_smoke.py "$CARGO_TARGET_DIR/debug/yonik-desktop" --output "$RUNNER_TEMP/gui-ui-a-compact" --width 380 --height 600 --scale 1.5
      - name: Сохранить диагностику синтетического UI при сбое
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-a-failure
          path: ${{ runner.temp }}/gui-ui-a*/
          retention-days: 3
          if-no-files-found: ignore
      - name: Удалить собственный runtime-каталог Qt
        if: ${{ always() && steps.qt_environment.outputs.runtime != '' }}
        env:
          YONIK_TEST_RUNTIME: ${{ steps.qt_environment.outputs.runtime }}
        run: |
          rmdir -- "$YONIK_TEST_RUNTIME"
