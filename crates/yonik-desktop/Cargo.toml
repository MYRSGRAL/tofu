[package]
name = "yonik-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[features]
default = []
startup-diagnostics = []
test-support = ["yonik-linux/test-support"]
gui = ["dep:cxx", "dep:cxx-qt", "dep:cxx-qt-lib", "dep:cxx-qt-build", "dep:cxx-gen"]

[[bin]]
name = "yonik-desktop"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
yonik-application = { path = "../yonik-application" }
yonik-domain = { path = "../yonik-domain" }
yonik-linux = { path = "../yonik-linux" }
yonik-engine = { path = "../yonik-engine" }
yonik-import = { path = "../yonik-import" }
tokio = { version = "1.48.0", features = ["rt", "macros", "time", "sync", "net", "io-util", "signal"] }
rustix = { version = "1.1.2", features = ["fs", "process"] }
zeroize = "1.9.1"
getrandom = "0.2.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
cxx = { version = "=1.0.176", optional = true }
cxx-qt = { version = "=0.10.0", optional = true }
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml"], optional = true }

[build-dependencies]
cxx-qt-build = { version = "=0.10.0", optional = true }
# Генератор и Rust macro CXX должны использовать одинаковую версию ABI.
cxx-gen = { version = "=0.7.176", optional = true }

# Backend запрещает unsafe в lib.rs; binary разрешает только generated FFI.
[lints.rust]
unsafe_code = "deny"

[dev-dependencies]
# Включает observer в исходном integration harness при обычном cargo test.
yonik-desktop = { path = ".", features = ["startup-diagnostics"] }
yonik-linux = { path = "../yonik-linux", features = ["test-support"] }

[[test]]
name = "p10_gate"
path = "tests/p10_gate.rs"
harness = false

[[example]]
name = "tray_cleanup_negative"
path = "tests/support/tray_cleanup_negative.rs"
required-features = ["gui", "test-support"]

[[example]]
name = "logs_negative"
path = "tests/support/logs_negative.rs"
required-features = ["gui", "test-support"]

[[example]]
name = "p11schedulerE2E"
path = "examples/p11schedulerE2E.rs"
required-features = ["gui", "test-support"]

[[example]]
name = "p11schedulerFullE2E"
path = "examples/p11schedulerFullE2E.rs"
required-features = ["gui", "test-support"]

[[example]]
name = "p11schedulerOwnerE2E"
path = "examples/p11schedulerOwnerE2E.rs"
required-features = ["gui", "test-support"]

[[example]]
name = "p11schedulerIntervalE2E"
path = "examples/p11schedulerIntervalE2E.rs"
required-features = ["gui", "test-support"]

[[example]]
name = "p11schedulerImportE2E"
path = "examples/p11schedulerImportE2E.rs"
required-features = ["gui", "test-support"]

[[example]]
name = "startup_host"
path = "examples/startup_host.rs"
required-features = ["startup-diagnostics"]
