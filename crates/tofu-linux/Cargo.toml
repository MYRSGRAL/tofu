[package]
name = "tofu-linux"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tofu-application = { path = "../tofu-application" }
tofu-engine = { path = "../tofu-engine" }
tofu-import = { path = "../tofu-import" }
serde_json = "1.0.154"
tokio = { version = "1.48.0", features = ["rt", "macros", "process", "signal", "time", "net", "io-util", "sync"] }
reqwest = { version = "0.12.24", default-features = false, features = ["socks", "rustls-tls-native-roots"] }
sha2 = "0.10.9"
rustix = { version = "1.1.2", features = ["fs", "process"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring"] }

[[bin]]
name = "tofu-local"
path = "src/main.rs"

[lints]
workspace = true
