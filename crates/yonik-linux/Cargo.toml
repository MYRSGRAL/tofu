[package]
name = "yonik-linux"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
yonik-application = { path = "../yonik-application" }
yonik-engine = { path = "../yonik-engine" }
yonik-import = { path = "../yonik-import" }
yonik-subscription = { path = "../yonik-subscription" }
rusqlite = "=0.32.1"
chacha20poly1305 = "=0.10.1"
getrandom = "0.2.17"
zeroize = "1.9.1"
secret-service = { version = "=4.0.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.48.0", features = ["rt", "macros", "process", "signal", "time", "net", "io-util", "sync"] }
reqwest = { version = "0.12.24", default-features = false, features = ["socks", "rustls-tls-native-roots"] }
sha2 = "0.10.9"
hmac = "0.12.1"
rustix = { version = "1.1.2", features = ["fs", "process", "net"] }
zbus = { version = "=4.4.0", default-features = false, features = ["tokio"] }
futures-util = "=0.3.34"
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring"] }

[[bin]]
name = "yonik-local"
path = "src/main.rs"

[lints]
workspace = true
