[package]
name = "tofu-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
default = []
gui = ["dep:cxx", "dep:cxx-qt", "dep:cxx-qt-lib", "dep:cxx-qt-build", "dep:cxx-gen"]

[[bin]]
name = "tofu-desktop"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
tofu-application = { path = "../tofu-application" }
tofu-domain = { path = "../tofu-domain" }
tofu-linux = { path = "../tofu-linux" }
tofu-engine = { path = "../tofu-engine" }
tokio = { version = "1.48.0", features = ["rt", "macros", "time", "sync", "net", "io-util", "signal"] }
rustix = { version = "1.1.2", features = ["fs", "process"] }
zeroize = "1.9.1"
getrandom = "0.2.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
cxx = { version = "=1.0.176", optional = true }
cxx-qt = { version = "=0.10.0", optional = true }
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml"], optional = true }

[build-dependencies]
cxx-qt-build = { version = "=0.10.0", optional = true }
# Генератор и Rust macro CXX должны использовать одинаковую версию ABI.
cxx-gen = { version = "=0.7.176", optional = true }

# Backend запрещает unsafe в lib.rs; binary разрешает только generated FFI.
[lints.rust]
unsafe_code = "deny"
