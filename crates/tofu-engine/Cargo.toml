[package]
name = "tofu-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
tofu-import = { path = "../tofu-import" }
tofu-domain = { path = "../tofu-domain" }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
url = "2.5.8"
base64 = "0.23.1"
getrandom = "0.2.17"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[lints]
workspace = true

[[bin]]
name = "tofu-compile"
path = "src/main.rs"
